name = "bms-money"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# 정적 파일(로그인/화면 HTML, CSS, JS)을 서빙하는 설정입니다.
# public 폴더 안의 파일들이 그대로 서빙되고, /api/ 로 시작하는 요청만 worker.js 코드가 처리합니다.
[assets]
directory = "./public"
binding = "ASSETS"

# D1 데이터베이스 연결 설정입니다.
# 아래 database_id 값은 README 안내에 따라 `npx wrangler d1 create` 실행 후 나오는 값으로 반드시 교체해야 합니다.
[[d1_databases]]
binding = "DB"
database_name = "bms-money-db"
database_id = "34677038-d8a8-432f-a81e-3044c909d9b8"

# R2 버킷 연결 설정입니다("관리규약" 탭에서 업로드하는 파일 실물 저장용).
# Cloudflare 대시보드 -> R2 -> "Create bucket"에서 아래 bucket_name과 정확히 같은
# 이름으로 버킷을 먼저 만들어야 합니다(버킷 이름이 다르면 이 줄의 bucket_name 값을
# 실제로 만든 이름으로 맞춰주세요).
[[r2_buckets]]
binding = "RULES_BUCKET"
bucket_name = "bms-money-site-rules"
